# Used when the application is started with the "mysql" profile:
#   .\mvnw.cmd spring-boot:run "-Dspring-boot.run.profiles=mysql"
#
# The connection details come from environment variables, so that no password
# is ever written into a file that goes to GitHub:
#   SAKAY_DB_URL       (default: the sakay_sugbo database on this computer, port 3306)
#   SAKAY_DB_USER      (default: root)
#   SAKAY_DB_PASSWORD  (no default)
#
# About the default address:
#   createDatabaseIfNotExist  makes the empty database on first start
#   rewriteBatchedStatements  sends the start-up import as a few large inserts
#                             instead of 25,000 small ones
spring.datasource.url=${SAKAY_DB_URL:jdbc:mysql://localhost:3306/sakay_sugbo?createDatabaseIfNotExist=true&rewriteBatchedStatements=true}
spring.datasource.username=${SAKAY_DB_USER:root}
spring.datasource.password=${SAKAY_DB_PASSWORD:}

# The H2 console only makes sense for the in-memory database.
spring.h2.console.enabled=false
