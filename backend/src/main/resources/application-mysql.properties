# Used when the application is started with --spring.profiles.active=mysql
#
# NOT YET TESTED: MySQL was not installed on the machine this was written on.
#
# The user name and password come from environment variables, so that no
# password is ever written into a file that goes to GitHub:
#   SAKAY_DB_USER      (default: root)
#   SAKAY_DB_PASSWORD  (no default)
spring.datasource.url=jdbc:mysql://localhost:3306/sakay_sugbo?createDatabaseIfNotExist=true&serverTimezone=Asia/Manila
spring.datasource.username=${SAKAY_DB_USER:root}
spring.datasource.password=${SAKAY_DB_PASSWORD:}
spring.h2.console.enabled=false
