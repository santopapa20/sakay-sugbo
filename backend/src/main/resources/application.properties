spring.application.name=sakay-sugbo-backend
server.port=8080

# ---------------------------------------------------------------- database
# Default: H2, a small database that lives in memory. Nothing to install, and
# it is refilled from the GeoJSON files every time the application starts.
# For MySQL, start with:  --spring.profiles.active=mysql
# (settings are in application-mysql.properties).
spring.datasource.url=jdbc:h2:mem:sakaysugbo;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Create or update the tables from the entity classes at start-up.
spring.jpa.hibernate.ddl-auto=update
# Database work happens in the service layer, not while JSON is being written.
spring.jpa.open-in-view=false
# Send inserts to the database in groups: the import writes about 25,000 rows.
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true

# The H2 web console is for looking at the tables while developing:
# http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:sakaysugbo, user: sa, no password)
spring.h2.console.enabled=true
