# Runs on GitHub's servers every time code is pushed.
#
#   1. frontend  type-check, unit tests, production build
#   2. backend   all Java tests (on the built-in H2 database)
#   3. deploy    only on the main branch, and only if 1 and 2 both passed:
#                publishes the built frontend to GitHub Pages
#
# One-time setup on github.com: Settings -> Pages -> Source: "GitHub Actions".
name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:

# By default a job may only read the code. The deploy job asks for more, below.
permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (check, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # "ci" installs exactly what package-lock.json says, nothing newer.
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Keep the built site so the deploy job can publish it.
      - name: Keep the built site for deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  backend:
    name: Backend (Java tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # The tests import the real route data from frontend/public/data.
      - run: ./mvnw -B test

  deploy:
    name: Publish to GitHub Pages
    needs: [frontend, backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # If two pushes arrive close together, finish the first deployment before starting the next.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
